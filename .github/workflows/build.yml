name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: unzip -q StreamBox-Android.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: StreamBox
      - uses: actions/upload-artifact@v7
        with:
          name: StreamBox-APK
          path: StreamBox/app/build/outputs/apk/debug/app-debug.apk
